<!DOCTYPE html>
<html lang="en" ng-app="videoApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Video Portal</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <style>
        .card {
            margin: 10px;
        }
    </style>
</head>
<body ng-controller="VideoController">
    <div class="container">
        <h1>Welcome, {{studentInfo.displayName}}</h1>
        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link active" data-bs-toggle="tab" href="#myVideo">My Video</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#peerVideos">Peer Videos</a>
            </li>
        </ul>

        <div class="tab-content">
            <div id="myVideo" class="tab-pane fade show active">
                <h2>Your Video</h2>
                <iframe ng-src="{{studentInfo.videoLink | trusted}}" width="100%" height="200" frameborder="0" allowfullscreen></iframe>
            </div>
            <div id="peerVideos" class="tab-pane fade">
                <h2>Peer Videos</h2>
                <div class="row">
                    <div class="col-4" ng-repeat="video in videos">
                        <div class="card">
                            <iframe ng-src="{{video.link | trusted}}" width="100%" height="200" frameborder="0" allowfullscreen></iframe>
                            <div class="card-body">
                                <h5 class="card-title">{{video.displayName}}</h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
      angular.module('videoApp', [])
        .filter('trusted', ['$sce', function($sce) {
            return function(link) {
                return $sce.trustAsResourceUrl(link);
            };
        }])
        .controller('VideoController', function($scope) {
            google.script.run.withSuccessHandler(function(data) {
                console.log(data);
                $scope.studentInfo = data.studentInfo;
                $scope.videos = data.videos;
                $scope.$apply();
            }).getStudentData(); // No parameter needed
        });
    </script>
</body>
</html>
