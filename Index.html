<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Video Viewer</title>
    <base target="_top">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      /* Layout Container */
      .approver-layout {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* Mobile Controls (Default) */
      .mobile-roster-select {
        display: block;
        margin-bottom: 16px;
      }
      .desktop-roster-sidebar {
        display: none;
      }

      .roster-item-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 8px 12px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        text-align: left;
        cursor: pointer;
        transition: all 0.15s ease-in-out;
      }
      .roster-item-btn:hover {
        background: #edf2f7;
      }
      .roster-item-btn.is-active {
        background: #ebf8ff;
        border-color: #3182ce;
        font-weight: 600;
      }

      .carousel-container {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .carousel-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        flex-grow: 1;
      }

      .carousel-btn {
        background: #007bff;
        color: white;
        border: none;
        border-radius: 50%;
        width: 44px;
        height: 44px;
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.2s;
        flex-shrink: 0;
      }
      .carousel-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
        opacity: 0.5;
      }
      .pagination-indicator {
        text-align: center;
        margin-top: 12px;
        font-weight: bold;
        color: #555;
      }

      /* Desktop / Laptop Layout Splits (>= 992px) */
      @media (min-width: 992px) {
        .approver-layout {
          display: grid;
          grid-template-columns: 1fr 3fr; /* 1/4 width sidebar, 3/4 width video panel */
          gap: 24px;
          align-items: start;
        }

        .mobile-roster-select {
          display: none; /* Hide mobile dropdown */
        }
        .desktop-roster-sidebar {
          display: block; /* Show sidebar list */
          background: #f8f9fa;
          padding: 16px;
          border-radius: 8px;
          max-height: 75vh;
          overflow-y: auto;
        }

        .roster-list {
          display: flex;
          flex-direction: column;
          gap: 8px;
        }

        .carousel-grid {
          grid-template-columns: repeat(2, 1fr); /* 2x2 grid for 4 videos */
        }
      }
    </style>
  </head>
  <?!= include("css"); ?>
  <body>
    <div id="root"></div>
    
    <script type="text/babel">
      const OAUTH_TOKEN = "<?!= ScriptApp.getOAuthToken() ?>";

      function App() {
        const [userData, setUserData] = React.useState(null);
        
        React.useEffect(() => {
          google.script.run
            .withSuccessHandler(setUserData)
            .getUserData();
        }, []);
        
        if (!userData) {
          return (
            <div className="app-shell app-shell--loading" aria-live="polite">
              <div className="status-card">Loading portal...</div>
            </div>
          );
        }
        
        if (!userData.isStudent && !userData.isParent && !userData.isApprover) {
          return (
            <div className="app-shell">
              <header className="hero-card">
                <p className="eyebrow">Cloud Video Viewer</p>
                <h1>Access is limited to school users</h1>
                <p>For Y6-9 students and parents. Log in with your school account.</p>
              </header>
            </div>
          );
        }
        
        return (
          <div className="app-shell">
            <header className="hero-card">
              <p className="eyebrow">Cloud Video Viewer</p>
              <h1>{userData.displayName || 'Viewer'}</h1>
              <p>
                {userData.isApprover
                  ? 'Teacher moderation view'
                  : userData.isStudent
                  ? 'Student portal'
                  : 'Family portal'}
              </p>
            </header>

            {userData.isApprover ? <ApproverView userData={userData} /> : userData.isStudent ? <StudentView userData={userData} /> : <ParentView userData={userData} />}
          </div>
        );
      }

      function normalizeVideo(videoValue) {
        if (!videoValue) {
          return { isValid: false, status: 'missing', fileId: '', openUrl: '' };
        }

        let fileId = '';
        let openUrl = '';

        if (typeof videoValue === 'string') {
          const raw = videoValue.trim();
          const idMatch = raw.match(/[-\w]{25,}/);
          if (!idMatch) {
            return { isValid: false, status: 'invalid', fileId: '', openUrl: raw };
          }
          fileId = idMatch[0];
          openUrl = `https://drive.google.com/file/d/${fileId}/view`;
        } else if (typeof videoValue === 'object') {
          fileId = videoValue.fileId || '';
          openUrl = videoValue.openUrl || '';
          
          if (!fileId && openUrl) {
            const idMatch = openUrl.match(/[-\w]{25,}/);
            if (idMatch) fileId = idMatch[0];
          }
        }

        if (!fileId) {
          return { isValid: false, status: 'invalid', fileId: '', openUrl: openUrl };
        }

        return {
          isValid: true,
          status: videoValue.status || 'ready',
          fileId: fileId,
          openUrl: openUrl || `https://drive.google.com/file/d/${fileId}/view`
        };
      }

      function VideoPlayer({ video, title }) {
        const normalized = normalizeVideo(video);
        const [videoSrc, setVideoSrc] = React.useState(null);
        const [loading, setLoading] = React.useState(false);
        const [error, setError] = React.useState(null);

        React.useEffect(() => {
          let isMounted = true;
          let currentBlobUrl = null;

          if (!normalized.isValid || !normalized.fileId) {
            setVideoSrc(null);
            return;
          }

          async function fetchVideoDirectly() {
            setLoading(true);
            setError(null);

            try {
              const response = await fetch(
                `https://www.googleapis.com/drive/v3/files/${normalized.fileId}?alt=media`,
                {
                  headers: { Authorization: `Bearer ${OAUTH_TOKEN}` }
                }
              );

              if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

              const blob = await response.blob();
              currentBlobUrl = URL.createObjectURL(blob);

              if (isMounted) {
                setVideoSrc(currentBlobUrl);
                setLoading(false);
              }
            } catch (err) {
              if (isMounted) {
                console.error("Failed to load video stream:", err);
                setError("Unable to stream video natively.");
                setLoading(false);
              }
            }
          }

          fetchVideoDirectly();

          return () => {
            isMounted = false;
            if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
          };
        }, [normalized.fileId]);

        if (!normalized.isValid || normalized.status === 'missing') {
          return <div className="status-card">No video posted yet.</div>;
        }

        return (
          <div className="video-player">
            <div className="video-frame">
              {loading ? (
                <div className="status-card">Loading video stream...</div>
              ) : error ? (
                <div className="status-card">
                  <p>{error}</p>
                  <a className="inline-link" href={normalized.openUrl} target="_blank" rel="noopener noreferrer">Watch on Google Drive</a>
                </div>
              ) : videoSrc ? (
                <video controls preload="metadata" src={videoSrc} width="100%" />
              ) : null}
            </div>

            <div className="player-actions">
              {normalized.openUrl ? (
                <a className="inline-link" href={normalized.openUrl} target="_blank" rel="noopener noreferrer">Open in Google Drive</a>
              ) : null}
            </div>
          </div>
        );
      }

      function ApproverView({ userData }) {
        const [selectedHomeroom, setSelectedHomeroom] = React.useState('');
        const [homerooms, setHomerooms] = React.useState([]);
        const [allHomeroomStudents, setAllHomeroomStudents] = React.useState([]);
        const [pageSize, setPageSize] = React.useState(4);
        const [currentPage, setCurrentPage] = React.useState(0);
        const [selectedStudentIndex, setSelectedStudentIndex] = React.useState(0);

        React.useEffect(() => {
          const uniqueHomerooms = [...new Set(userData.allVideos.map(v => v.homeroom))];
          setHomerooms(uniqueHomerooms);
          if (uniqueHomerooms.length > 0) setSelectedHomeroom(uniqueHomerooms[0]);
        }, [userData]);

        React.useEffect(() => {
          const filtered = userData.allVideos.filter(v => v.homeroom === selectedHomeroom);
          setAllHomeroomStudents(filtered);
          setCurrentPage(0);
          setSelectedStudentIndex(0);
        }, [selectedHomeroom, userData]);

        React.useEffect(() => {
          function updatePageSize() {
            if (window.innerWidth < 992) {
              setPageSize(1); // Mobile: 1 video card at a time
            } else {
              setPageSize(4); // Desktop/Laptop: 4 video cards (2x2 grid)
            }
          }

          updatePageSize();
          window.addEventListener('resize', updatePageSize);
          return () => window.removeEventListener('resize', updatePageSize);
        }, []);

        const validVideoSubmissions = allHomeroomStudents.filter(s => normalizeVideo(s.video).isValid);
        const totalPages = Math.ceil(validVideoSubmissions.length / pageSize) || 1;
        const visibleVideos = validVideoSubmissions.slice(
          currentPage * pageSize, 
          (currentPage + 1) * pageSize
        );

        const handleSelectStudent = (studentName) => {
          const indexInSubmissions = validVideoSubmissions.findIndex(s => s.displayName === studentName);
          if (indexInSubmissions !== -1) {
            const targetPage = Math.floor(indexInSubmissions / pageSize);
            setCurrentPage(targetPage);
            setSelectedStudentIndex(indexInSubmissions);
          }
        };

        return (
          <section className="panel">
            <div className="filter-bar" style={{ marginBottom: '20px' }}>
              <h2>Teacher View</h2>
              <label>
                Homeroom
                <select value={selectedHomeroom} onChange={(e) => setSelectedHomeroom(e.target.value)}>
                  {homerooms.map((hr, idx) => (
                    <option key={idx} value={hr}>{hr}</option>
                  ))}
                </select>
              </label>
            </div>

            {/* Mobile View Roster Selector (Visible < 992px) */}
            <div className="mobile-roster-select">
              <label style={{ width: '100%' }}>
                Select Student:
                <select 
                  style={{ width: '100%', marginTop: '4px' }}
                  onChange={(e) => handleSelectStudent(e.target.value)}
                >
                  {allHomeroomStudents.map((s, idx) => {
                    const hasVideo = normalizeVideo(s.video).isValid;
                    return (
                      <option key={idx} value={s.displayName}>
                        {hasVideo ? '✅' : '⚠️'} {s.displayName}
                      </option>
                    );
                  })}
                </select>
              </label>
            </div>

            {/* Split Screen Layout Container */}
            <div className="approver-layout">
              
              {/* Desktop Left Sidebar (1/4 Width) */}
              <div className="desktop-roster-sidebar">
                <h4 style={{ fontSize: '1.1rem', marginBottom: '12px' }}>
                  Roster ({allHomeroomStudents.length})
                </h4>
                <div className="roster-list">
                  {allHomeroomStudents.map((student, idx) => {
                    const hasVideo = normalizeVideo(student.video).isValid;
                    const isSelected = validVideoSubmissions[selectedStudentIndex]?.displayName === student.displayName;
                    
                    return (
                      <button
                        key={idx}
                        type="button"
                        className={`roster-item-btn ${isSelected ? 'is-active' : ''}`}
                        onClick={() => handleSelectStudent(student.displayName)}
                        disabled={!hasVideo}
                      >
                        <span>{student.displayName}</span>
                        <span>{hasVideo ? '✅' : '⚠️'}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Main Video Viewing Gallery (3/4 Width) */}
              <div className="carousel-section">
                <h3>Submitted Videos ({validVideoSubmissions.length})</h3>
                
                {validVideoSubmissions.length === 0 ? (
                  <div className="status-card">No videos submitted for this homeroom yet.</div>
                ) : (
                  <div>
                    <div className="carousel-container">
                      <button 
                        className="carousel-btn" 
                        onClick={() => setCurrentPage(p => Math.max(0, p - 1))}
                        disabled={currentPage === 0}
                        aria-label="Previous videos"
                      >
                        &#10094;
                      </button>

                      <div className="carousel-grid">
                        {visibleVideos.map((video, index) => (
                          <article key={`${currentPage}-${index}`} className="video-card">
                            <h3>{video.displayName}</h3>
                            <p className="card-meta">{video.homeroom}</p>
                            <VideoPlayer video={video.video} title={`${video.displayName} video`} />
                          </article>
                        ))}
                      </div>

                      <button 
                        className="carousel-btn" 
                        onClick={() => setCurrentPage(p => Math.min(totalPages - 1, p + 1))}
                        disabled={currentPage >= totalPages - 1}
                        aria-label="Next videos"
                      >
                        &#10095;
                      </button>
                    </div>
                    
                    <div className="pagination-indicator">
                      Page {currentPage + 1} of {totalPages}
                    </div>
                  </div>
                )}
              </div>

            </div>
          </section>
        );
      }

      function StudentView({ userData }) {
        const [activeTab, setActiveTab] = React.useState('myVideo');

        return (
          <section className="panel">
            <div className="tabs">
              <button className={`tab-btn ${activeTab === 'myVideo' ? 'is-active' : ''}`} onClick={() => setActiveTab('myVideo')}>My Video</button>
              <button className={`tab-btn ${activeTab === 'yearGroup' ? 'is-active' : ''}`} onClick={() => setActiveTab('yearGroup')}>Year Group</button>
            </div>

            {activeTab === 'myVideo' ? (
              <div className="card-stack">
                <article className="video-card">
                  <h2>My Submission</h2>
                  <VideoPlayer video={userData.video} title={`${userData.displayName} video`} />
                </article>
              </div>
            ) : (
              <div className="video-grid">
                {userData.yearGroupVideos && userData.yearGroupVideos.map((v, i) => (
                  <article key={i} className="video-card">
                    <h3>{v.displayName}</h3>
                    <VideoPlayer video={v.video} title={`${v.displayName} video`} />
                  </article>
                ))}
              </div>
            )}
          </section>
        );
      }

      function ParentView({ userData }) {
        return (
          <section className="panel">
            <h2>Videos From Your Family</h2>
            <div className="video-grid">
              {userData.childrenVideos && userData.childrenVideos.map((v, i) => (
                <article key={i} className="video-card">
                  <h3>{v.displayName}</h3>
                  <VideoPlayer video={v.video} title={`${v.displayName} video`} />
                </article>
              ))}
            </div>
          </section>
        );
      }

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
  </body>
</html>
