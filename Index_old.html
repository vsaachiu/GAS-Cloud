<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Video Viewer</title>
    <base target="_top">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  </head>
  <?!= include("css"); ?>
  <body>
    <div id="root"></div>
    
    <script type="text/babel">
      function App() {
        const [userData, setUserData] = React.useState(null);
        
        React.useEffect(() => {
          google.script.run
            .withSuccessHandler(setUserData)
            .getUserData();
        }, []);
        
        if (!userData) {
          return (
            <div className="app-shell app-shell--loading" aria-live="polite">
              <div className="status-card">Loading videos...</div>
            </div>
          );
        }
        
        if (!userData.isStudent && !userData.isParent && !userData.isApprover) {
          return (
            <div className="app-shell">
              <header className="hero-card">
                <p className="eyebrow">Cloud Video Viewer</p>
                <h1>Access is limited to school users</h1>
                <p>For Y6-9 students and parents. Log in with your school account.</p>
              </header>
            </div>
          );
        }
        
        return (
          <div className="app-shell">
            <header className="hero-card">
              <p className="eyebrow">Cloud Video Viewer</p>
              <h1>{userData.displayName || 'Viewer'}</h1>
              <p>
                {userData.isApprover
                  ? 'Teacher moderation view'
                  : userData.isStudent
                  ? 'Student portal'
                  : 'Family portal'}
              </p>
            </header>

            {userData.isApprover ? <ApproverView userData={userData} /> : userData.isStudent ? <StudentView userData={userData} /> : <ParentView userData={userData} />}
          </div>
        );
      }

      function normalizeVideo(videoValue) {
        if (!videoValue) {
          return {
            isValid: false,
            status: 'missing',
            previewUrl: '',
            directUrl: '',
            openUrl: ''
          };
        }

        if (typeof videoValue === 'string') {
          const raw = videoValue.trim();
          const idMatch = raw.match(/[-\w]{25,}/);
          if (!idMatch) {
            return {
              isValid: false,
              status: 'invalid',
              previewUrl: '',
              directUrl: '',
              openUrl: raw
            };
          }

          const fileId = idMatch[0];
          return {
            isValid: true,
            status: 'ready',
            previewUrl: `https://drive.google.com/file/d/${fileId}/preview`,
            directUrl: `https://drive.google.com/uc?export=download&id=${fileId}`,
            openUrl: `https://drive.google.com/file/d/${fileId}/view`
          };
        }

        return {
          ...videoValue,
          isValid: Boolean(videoValue.isValid),
          status: videoValue.status || 'invalid',
          previewUrl: videoValue.previewUrl || '',
          directUrl: videoValue.directUrl || '',
          openUrl: videoValue.openUrl || ''
        };
      }

      function VideoPlayer({ video, title }) {
        const normalized = normalizeVideo(video);
        const [mode, setMode] = React.useState(normalized.directUrl ? 'video' : normalized.previewUrl ? 'iframe' : 'link');

        React.useEffect(() => {
          setMode(normalized.directUrl ? 'video' : normalized.previewUrl ? 'iframe' : 'link');
        }, [normalized.directUrl, normalized.previewUrl, normalized.openUrl]);

        if (!normalized.isValid || normalized.status === 'missing' || normalized.status === 'not_posted') {
          return <div className="status-card">No video posted yet.</div>;
        }

        if (normalized.status === 'invalid') {
          return (
            <div className="status-card">
              <p>This video link is invalid.</p>
              {normalized.openUrl ? (
                <a className="inline-link" href={normalized.openUrl} target="_blank" rel="noopener noreferrer">Open source link</a>
              ) : null}
            </div>
          );
        }

        return (
          <div className="video-player">
            <div className="video-frame">
              {mode === 'video' ? (
                <video
                  key={`video-${normalized.directUrl}`}
                  controls
                  preload="metadata"
                  src={normalized.directUrl}
                  onError={() => {
                    if (normalized.previewUrl) {
                      setMode('iframe');
                    } else {
                      setMode('link');
                    }
                  }}
                />
              ) : mode === 'iframe' ? (
                <iframe
                  key={`iframe-${normalized.previewUrl}`}
                  title={title}
                  src={normalized.previewUrl}
                  frameBorder="0"
                  allow="autoplay; encrypted-media"
                  allowFullScreen
                />
              ) : (
                <div className="status-card">
                  <p>Inline playback is unavailable in this browser context.</p>
                </div>
              )}
            </div>

            <div className="player-actions">
              {normalized.openUrl ? (
                <a className="inline-link" href={normalized.openUrl} target="_blank" rel="noopener noreferrer">Open in Google Drive</a>
              ) : null}
              {mode !== 'iframe' && normalized.previewUrl ? (
                <button type="button" className="ghost-btn" onClick={() => setMode('iframe')}>Try embedded preview</button>
              ) : null}
            </div>
          </div>
        );
      }

      function StudentView({ userData }) {
        const [activeTab, setActiveTab] = React.useState('myVideo');

        const handleVideoSubmission = () => {
          if (!userData.videoSubmissionFormUrl) {
            window.alert('The video submission form is not configured.');
            return;
          }

          window.open(userData.videoSubmissionFormUrl, '_blank');
        };

        return (
          <section className="panel">
            <div className="tabs" role="tablist" aria-label="Student views">
              <button
                type="button"
                role="tab"
                aria-selected={activeTab === 'myVideo'}
                className={`tab-btn ${activeTab === 'myVideo' ? 'is-active' : ''}`}
                onClick={() => setActiveTab('myVideo')}
              >
                My Video
              </button>
              <button
                type="button"
                role="tab"
                aria-selected={activeTab === 'yearGroup'}
                className={`tab-btn ${activeTab === 'yearGroup' ? 'is-active' : ''}`}
                onClick={() => setActiveTab('yearGroup')}
              >
                Year Group
              </button>
            </div>

            {activeTab === 'myVideo' ? (
              <div className="card-stack">
                <article className="video-card">
                  <h2>My Submission</h2>
                  <VideoPlayer video={userData.video} title={`${userData.displayName} video`} />
                </article>
                {!normalizeVideo(userData.video).isValid ? (
                  <article className="status-card">
                    {userData.videoSubmissionFormUrl ? (
                      <button type="button" className="primary-btn" onClick={handleVideoSubmission}>Submit your video now</button>
                    ) : (
                      <p>The submission form has not been configured yet.</p>
                    )}
                  </article>
                ) : null}
              </div>
            ) : (
              <div>
                <h2>Year Group Videos</h2>
                <div className="video-grid">
                  {userData.yearGroupVideos && userData.yearGroupVideos.length > 0 ? userData.yearGroupVideos.map((video, index) => (
                    <article key={index} className="video-card">
                      <h3>{video.displayName}</h3>
                      <VideoPlayer video={video.video} title={`${video.displayName} video`} />
                    </article>
                  )) : (
                    <div className="status-card">No year group videos are available yet.</div>
                  )}
                </div>
              </div>
            )}
          </section>
        );
      }

      function ParentView({ userData }) {
        return (
          <section className="panel">
            <h2>Videos From Your Family</h2>
            {userData.childrenVideos && userData.childrenVideos.length > 0 ? (
              <div className="video-grid">
                {userData.childrenVideos.map((video, index) => (
                  <article key={index} className="video-card">
                    <h3>{video.displayName}</h3>
                    <VideoPlayer video={video.video} title={`${video.displayName} video`} />
                  </article>
                ))}
              </div>
            ) : (
              <div className="status-card">When your child uploads a video, it will appear here.</div>
            )}
          </section>
        );
      } 

      function ApproverView({ userData }) {
        const [selectedHomeroom, setSelectedHomeroom] = React.useState('');
        const [homerooms, setHomerooms] = React.useState([]);
        const [videos, setVideos] = React.useState([]);

        React.useEffect(() => {
          const uniqueHomerooms = [...new Set(userData.allVideos.map(video => video.homeroom))];
          setHomerooms(uniqueHomerooms);
          setSelectedHomeroom(uniqueHomerooms[0]);
        }, [userData]);

        React.useEffect(() => {
          const filteredVideos = userData.allVideos.filter(video => video.homeroom === selectedHomeroom);
          setVideos(filteredVideos);
        }, [selectedHomeroom, userData]);

        const handleHomeroomChange = (event) => {
          setSelectedHomeroom(event.target.value);
        };

        return (
          <section className="panel">
            <div className="filter-bar">
              <h2>Teacher View</h2>
              <label>
                Homeroom
                <select value={selectedHomeroom} onChange={handleHomeroomChange}>
                  {homerooms.map((homeroom, index) => (
                    <option key={index} value={homeroom}>{homeroom}</option>
                  ))}
                </select>
              </label>
            </div>

            <div className="video-grid">
              {videos.map((video, index) => (
                <article key={index} className="video-card">
                  <h3>{video.displayName}</h3>
                  <p className="card-meta">{video.homeroom}</p>
                  <VideoPlayer video={video.video} title={`${video.displayName} video`} />
                </article>
              ))}
            </div>
          </section>
        );
      }
      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
  </body>
</html>
