<style>
:root {
  --color-primary: #376B90;
  --color-ink: #212121;
  --color-surface: #FFF;
  --color-accent: #62A5CC;
  --color-muted: #4f5e68;
  --color-border: #d4e3ee;
  --shadow-soft: 0 10px 28px rgba(33, 33, 33, 0.08);
  --radius-lg: 14px;
  --radius-md: 10px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  color: var(--color-ink);
  background:
    radial-gradient(circle at 15% 5%, rgba(98, 165, 204, 0.2), transparent 45%),
    linear-gradient(180deg, #edf4fa 0%, #f8fbfe 52%, #eef5fb 100%);
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh;
}

.app-shell {
  width: min(1120px, calc(100% - 32px));
  margin: 24px auto 42px;
  display: grid;
  gap: var(--space-5);
}

.app-shell--loading {
  width: min(700px, calc(100% - 32px));
}

.hero-card,
.panel,
.video-card,
.status-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
}

.hero-card {
  padding: var(--space-6);
  position: relative;
  overflow: hidden;
}

.hero-card::after {
  content: "";
  position: absolute;
  right: -60px;
  top: -68px;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: rgba(98, 165, 204, 0.24);
}

.hero-card h1 {
  margin: var(--space-2) 0 var(--space-2);
  font-size: clamp(1.6rem, 4.1vw, 2.2rem);
  line-height: 1.15;
  position: relative;
  z-index: 1;
}

.hero-card p {
  margin: 0;
  color: var(--color-muted);
  position: relative;
  z-index: 1;
}

.eyebrow {
  margin: 0;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-primary);
  font-size: 0.78rem;
}

.panel {
  padding: var(--space-5);
  display: grid;
  gap: var(--space-4);
}

.panel h2 {
  margin: 0;
  font-size: 1.4rem;
  color: var(--color-ink);
}

.panel h3 {
  margin: 0;
  font-size: 1.02rem;
}

.tabs {
  display: inline-flex;
  background: #eaf3f9;
  border-radius: 999px;
  padding: var(--space-1);
  gap: var(--space-1);
  align-self: flex-start;
}

.tab-btn {
  border: 0;
  border-radius: 999px;
  padding: 10px 16px;
  background: transparent;
  color: var(--color-ink);
  cursor: pointer;
  font-weight: 600;
}

.tab-btn.is-active {
  background: var(--color-primary);
  color: var(--color-surface);
}

.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: var(--space-4);
}

.video-card {
  padding: var(--space-4);
  display: grid;
  gap: var(--space-3);
}

.video-frame {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: var(--radius-md);
  overflow: hidden;
  background: #dbe9f4;
  border: 1px solid #c2d7e7;
}

.video-frame iframe,
.video-frame video {
  width: 100%;
  height: 100%;
  display: block;
}

.video-player {
  display: grid;
  gap: var(--space-2);
}

.player-actions {
  display: flex;
  gap: var(--space-3);
  align-items: center;
  flex-wrap: wrap;
}

.inline-link {
  color: var(--color-primary);
  font-weight: 600;
  text-decoration: none;
}

.inline-link:hover {
  text-decoration: underline;
}

.card-stack {
  display: grid;
  gap: var(--space-4);
}

.status-card {
  padding: var(--space-4);
  color: var(--color-ink);
}

.status-card p {
  margin: 0;
}

.primary-btn,
.ghost-btn {
  border-radius: 10px;
  padding: 10px 14px;
  font-weight: 600;
  border: 1px solid transparent;
  cursor: pointer;
}

.primary-btn {
  background: var(--color-primary);
  color: var(--color-surface);
}

.ghost-btn {
  background: #eef6fb;
  color: var(--color-ink);
  border-color: #c7ddea;
}

.filter-bar {
  display: flex;
  justify-content: space-between;
  gap: var(--space-3);
  align-items: end;
  flex-wrap: wrap;
}

.filter-bar label {
  display: grid;
  gap: 6px;
  font-size: 0.9rem;
  color: var(--color-muted);
  font-weight: 600;
}

.filter-bar select {
  min-width: 180px;
  border: 1px solid var(--color-border);
  border-radius: 10px;
  padding: 10px 12px;
  background: #fff;
  color: var(--color-ink);
}

.card-meta {
  margin: 0;
  color: var(--color-muted);
  font-size: 0.88rem;
}

button:focus-visible,
a:focus-visible,
select:focus-visible {
  outline: 3px solid var(--color-accent);
  outline-offset: 2px;
}

@media (max-width: 768px) {
  .app-shell {
    width: calc(100% - 20px);
    margin-top: 14px;
  }

  .hero-card,
  .panel {
    padding: var(--space-4);
  }

  .filter-bar {
    align-items: stretch;
  }

  .filter-bar label,
  .filter-bar select,
  .primary-btn {
    width: 100%;
  }
}
</style>
